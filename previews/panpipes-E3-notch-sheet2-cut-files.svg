  <rect x="0.0" y="0.0" width="548.94" height="279.52" fill="#ffffff"/>
<title>Panpipes E3 to E4, notch edge, sheet 2 of 3</title>
<desc>1 user unit = 1mm. Panpipes, E3 to E4, notch edge, sheet 2 of 3: back plate, wall. 3mm ply, drawn for a 0.13mm kerf. Blue #0000ff engraves the plugs' places on the front plate, on the plates' outside faces, which lie face up. Then orange #ff8000 cuts the slots, and black #000000 frees the parts.</desc>
